name: Release

# This fork distributes through GitHub Releases only. Upstream also
# publishes an npm package via Trusted Publishing; that job is
# deliberately absent here, because Trusted Publishing is bound to
# upstream's package and repository and cannot be inherited by a fork.
# Removing it beats leaving a job that fails on every tag.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: renga-cp-windows-x64.exe
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: renga-cp-macos-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: renga-cp-macos-arm64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: renga-cp-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux static-linking toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/renga-cp ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/renga-cp.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum renga-cp-windows-x64.exe/renga-cp-windows-x64.exe \
                    renga-cp-macos-x64/renga-cp-macos-x64 \
                    renga-cp-macos-arm64/renga-cp-macos-arm64 \
                    renga-cp-linux-x64/renga-cp-linux-x64 \
            | sed 's|[^ ]*/||' > ../checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/renga-cp-windows-x64.exe/renga-cp-windows-x64.exe
            artifacts/renga-cp-macos-x64/renga-cp-macos-x64
            artifacts/renga-cp-macos-arm64/renga-cp-macos-arm64
            artifacts/renga-cp-linux-x64/renga-cp-linux-x64
            checksums.txt
